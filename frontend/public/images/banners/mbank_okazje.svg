<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8102E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E91E3A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="url(#bg2)"/>
  
  <!-- Decorative geometric shapes -->
  <polygon points="700,0 800,0 800,100" fill="rgba(255,255,255,0.08)"/>
  <polygon points="750,100 800,100 800,200" fill="rgba(255,255,255,0.05)"/>
  <circle cx="650" cy="170" r="70" fill="url(#glow)"/>
  
  <!-- Decorative accent bar -->
  <rect x="0" y="0" width="800" height="8" fill="url(#shine)"/>
  
  <!-- Gift/offer icon -->
  <g transform="translate(50, 60)">
    <rect x="5" y="15" width="50" height="50" fill="white" opacity="0.9" rx="4"/>
    <rect x="27" y="0" width="6" height="65" fill="#FFD700"/>
    <rect x="5" y="37" width="50" height="6" fill="#FFD700"/>
    <path d="M 20 15 Q 20 5 30 5 Q 40 5 40 15" fill="none" stroke="white" stroke-width="3"/>
  </g>
  
  <!-- Star decorations -->
  <g transform="translate(120, 45)" fill="#FFD700" opacity="0.8">
    <path d="M 0,-8 L 2,-2 L 8,0 L 2,2 L 0,8 L -2,2 L -8,0 L -2,-2 Z"/>
  </g>
  <g transform="translate(140, 160)" fill="#FFD700" opacity="0.7">
    <path d="M 0,-6 L 1.5,-1.5 L 6,0 L 1.5,1.5 L 0,6 L -1.5,1.5 L -6,0 L -1.5,-1.5 Z"/>
  </g>
  
  <!-- Text content -->
  <text x="150" y="75" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white">
    mOkazje
  </text>
  <text x="150" y="110" font-family="Arial, sans-serif" font-size="20" fill="white" opacity="0.95">
    Oferty dostępne w aplikacji
  </text>
  <text x="150" y="145" font-family="Arial, sans-serif" font-size="18" fill="#FFD700" font-weight="600">
    • Zakupy i usługi w jednym miejscu
  </text>
  <text x="150" y="170" font-family="Arial, sans-serif" font-size="18" fill="#FFD700" font-weight="600">
    • Sprawdź aktualne propozycje
  </text>
</svg>
